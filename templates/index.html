<!DOCTYPE html>
<html>
<head>
    <title>Scena9 Live Scanner</title>
</head>
<body>
    <h1>Events</h1>

    {% for event in events %}
        <div>
            <h2>{{ event.title }}</h2>
            <p>{{ event.date.strftime("%d %B %Y, %H:%M") }},{{ event.venue }}</p>
        </div>
    {% endfor %}

</body>
</html>
